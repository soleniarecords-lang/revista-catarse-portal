# Gera o portal com o que está PUBLICADO no Supabase (painel "Revista Catarse" do Solenia Hub) e sobe no Cloudflare.
# Quem dispara: o Hub (aprovar, editar ou despublicar uma matéria) via workflow_dispatch, ou o botão "Republicar site".
# Segredos do repositório: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_ANON_KEY.
# Variável do repositório: SUPABASE_URL.
name: Publicar site

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: Motivo da publicação (aparece no histórico)
        required: false
        default: manual

# Uma publicação por vez. Se várias forem pedidas seguidas, a última da fila roda com o banco já atualizado.
concurrency:
  group: publicar-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Trazer as matérias publicadas do Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sincronizar-supabase.mjs

      - name: Gerar o site
        env:
          EDICOES_DIR: ${{ github.workspace }}/.sync/edicoes
          NOTICIAS_DIR: ${{ github.workspace }}/.sync/noticias
        run: |
          export SITE_URL="$(node -p "require('./publicar.config.json').siteUrl")"
          npm run build

      - name: Subir na Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
